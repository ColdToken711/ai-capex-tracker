  "CDNS": 88627,

const CACHE_KEY = "capex_cache_v1";
// Timeframes: range/interval for Yahoo spark requests. Day change is
// always vs the previous daily close (fulldayChangePercent / previousClose),
// never vs the last bar \u2014 which on intraday views would read ~0%.
const TIMEFRAMES = {
  "1M": { range: "1mo", interval: "1d", cap: "1-month \u00b7 daily closes" },
  "1W": { range: "5d", interval: "15m", cap: "1-week \u00b7 15-min bars" },
  "1D": { range: "1d", interval: "5m", cap: "1-day \u00b7 5-min bars" },
};
const cacheKeyFor = t => CACHE_KEY + "_" + t;
function loadCache(t) {
  try {
    const c = JSON.parse(localStorage.getItem(cacheKeyFor(t)));
    if (c && c.quotes) return c.quotes;
  } catch (e) {}
  return {};
}
const sleep = ms => new Promise(res => setTimeout(res, ms));

// ---------------------------------------------------------------
// State
// ---------------------------------------------------------------
let quotes = {};       // sym -> { c, prev, dp, d, hist: [{t,p}] }
let indexData = null;   // { cap: [...], eq: [...] } over the 1-month window
let activeTab = "Hyperscalers";
let autoRefresh = localStorage.getItem("capex_auto") !== "0";
let lastUpdated = null;
let loading = false;
let timer = null;
let failedSymbols = [];
let tf = "1M";        // active timeframe: 1M | 1W | 1D
let fetchGen = 0;    // refresh generation: stale fetches can't write

// ---------------------------------------------------------------
// Yahoo Finance (unofficial) via public CORS proxies, no API key.
// Multi-symbol spark requests: 15 tickers per call, so a full
// 58-name refresh is 4 requests. If a proxy is down or hangs, the
// chain falls through to the next one and benches the dead proxy
// for 10 minutes (allorigins had a full outage on 13 Nov 2026).
// ---------------------------------------------------------------
const QUOTE_PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  // r.jina.ai wraps payloads in a small markdown header \u2014 parseJsonLoose
  // strips it. Only viable because we batch 15 symbols per request.
  u => "https://r.jina.ai/" + u,
];
let proxyIdx = 0;
const proxyDeadUntil = [];
const PROXY_COOLDOWN = 10 * 60 * 1000;

async function proxyFetch(url) {
  let order = [];
  for (let k = 0; k < QUOTE_PROXIES.length; k++) {
    const i = (proxyIdx + k) % QUOTE_PROXIES.length;
    if (proxyDeadUntil[i] && Date.now() < proxyDeadUntil[i]) continue;
    order.push(i);
  }
  if (!order.length) {
    // everything in cooldown \u2014 try once anyway, it may have recovered
    for (let k = 0; k < QUOTE_PROXIES.length; k++) order.push((proxyIdx + k) % QUOTE_PROXIES.length);
  }
  let lastErr = null;
  for (const i of order) {
    try {
      const opts = typeof AbortSignal !== "undefined" && AbortSignal.timeout
        ? { signal: AbortSignal.timeout(15000) } : {};
      const r = await fetch(QUOTE_PROXIES[i](url), opts);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const t = await r.text();
      const trimmed = (t || "").trim();
      if (trimmed.length < 25 || /^(error code|oops|rate limit|too many)/i.test(trimmed)) {
        throw new Error("proxy refused");
      }
      proxyIdx = i;
      proxyDeadUntil[i] = 0;
      return t;
    } catch (e) { lastErr = e; proxyDeadUntil[i] = Date.now() + PROXY_COOLDOWN; }
  }
  throw lastErr || new Error("all proxies failed");
}

// Tolerant JSON extraction: r.jina.ai prepends a small markdown
// header, so slice from the first "{" to the last "}".
function parseJsonLoose(text) {
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b <= a) throw new Error("not JSON");
  return JSON.parse(text.slice(a, b + 1));
}

const SPARK_CHUNK = 15;
async function fetchSparkChunk(symbols, t) {
  const cfg = TIMEFRAMES[t];
  const target = "https://query1.finance.yahoo.com/v8/finance/spark?symbols=" +
    symbols.map(encodeURIComponent).join(",") + "&range=" + cfg.range + "&interval=" + cfg.interval;
  const text = await proxyFetch(target);
  const j = parseJsonLoose(text);
  const out = {};
  symbols.forEach(s => {
    const r = j[s];
    if (!r || !r.close || r.close.length < 2) return;
    const hist = [];
    (r.timestamp || []).forEach((t, i) => { if (r.close[i] != null) hist.push({ t, p: r.close[i] }); });
    if (hist.length < 2) return;
    const price = r.fulldayPrice != null ? r.fulldayPrice : hist[hist.length - 1].p;
    const prev = r.previousClose != null ? r.previousClose : hist[hist.length - 2].p;
    const dp = r.fulldayChangePercent != null ? r.fulldayChangePercent : (price - prev) / prev * 100;
    const d = r.fulldayChange != null ? r.fulldayChange : price - prev;
    out[s] = {
      c: price, prev: prev,
      dp: dp, d: d,
      hist: hist,
    };
  });
  return out;
}

// fallback for stragglers: single-symbol chart endpoint
async function fetchOne(sym, t) {
  const cfg = TIMEFRAMES[t];
  const target = "https://query1.finance.yahoo.com/v8/finance/chart/" +
    encodeURIComponent(sym) + "?range=" + cfg.range + "&interval=" + cfg.interval;
  const text = await proxyFetch(target);
  const j = parseJsonLoose(text);
  const res = j && j.chart && j.chart.result && j.chart.result[0];
  if (!res) throw new Error("no data");
  const m = res.meta || {};
  const ts = res.timestamp || [];
  const closes = (res.indicators && res.indicators.quote && res.indicators.quote[0] &&
    res.indicators.quote[0].close) || [];
  const hist = [];
  ts.forEach((t, i) => { if (closes[i] != null) hist.push({ t, p: closes[i] }); });
  const price = m.regularMarketPrice;
  if (!price || !hist.length) throw new Error("empty");
  // day change vs previous close; on intraday TFs the last bar is ~now,
  // so prefer Yahoo's own previousClose fields
  const prev = m.previousClose != null ? m.previousClose
    : (t === "1M" && hist.length >= 2) ? hist[hist.length - 2].p
    : (m.chartPreviousClose || hist[0].p);
  return {
    c: price, prev: prev,
    dp: (price - prev) / prev * 100, d: price - prev,
    hist: hist,
  };
}

async function fetchStragglers(symbols, into, failed, gen) {
  const CHUNK = 6;
  for (let i = 0; i < symbols.length; i += CHUNK) {
    const batch = symbols.slice(i, i + CHUNK);
    const results = await Promise.allSettled(batch.map(s => fetchOne(s, tf)));
    if (gen !== fetchGen) return; // superseded mid-retry
    results.forEach((res, j) => {
      if (res.status === "fulfilled") into[batch[j]] = res.value;
      else failed.push(batch[j]);
    });
    quotes = into;
    render();
    if (i + CHUNK < symbols.length) await sleep(1300);
  }
}

// ---------------------------------------------------------------
// Index: cap-weighted vs equal-weighted over the real 1-month
// daily history from Yahoo (no more accumulating points per
// refresh \u2014 we get actual daily closes now). Each stock
// normalized to its first close in the window, forward-filled to
// the union of trading days. Weights: baked-in market caps (USD).
// ---------------------------------------------------------------
function computeIndex(q) {
  const syms = ALL.filter(s => q[s] && q[s].hist.length > 2 && MCAPS[s]);
  if (!syms.length) return null;
  const capSum = syms.reduce((a, s) => a + MCAPS[s], 0);
  const datesSet = new Set();
  syms.forEach(s => q[s].hist.forEach(h => datesSet.add(h.t)));
  const dates = [...datesSet].sort((a, b) => a - b);
  const cap = [], eq = [];
  const lastSeen = {};
  for (const t of dates) {
    let capV = 0, eqV = 0;
    for (const s of syms) {
      const h = q[s].hist.find(x => x.t === t);
      if (h) lastSeen[s] = h.p;
      if (lastSeen[s] == null) continue;
      const r = lastSeen[s] / q[s].hist[0].p;
      capV += (MCAPS[s] / capSum) * r;
      eqV += r / syms.length;
    }
    cap.push({ t, v: capV });
    eq.push({ t, v: eqV });
  }
  return { cap: cap, eq: eq, n: syms.length };
}

function drawMulti(cv, series) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, h = cv.clientHeight || 120;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  let min = Infinity, max = -Infinity;
  series.forEach(s => s.data.forEach(d => { if (d.v < min) min = d.v; if (d.v > max) max = d.v; }));
  if (!isFinite(min) || series.some(s => s.data.length < 2)) return;
  const span = (max - min) || 1;
  const X = (data, i) => (i / (data.length - 1)) * (w - 8) + 4;
  const Y = v => h - 8 - ((v - min) / span) * (h - 16);
  ctx.clearRect(0, 0, w, h);
  if (min <= 1 && max >= 1) { // baseline at index start = 1.0
    ctx.beginPath(); ctx.setLineDash([3, 4]);
    ctx.moveTo(0, Y(1)); ctx.lineTo(w, Y(1));
    ctx.strokeStyle = "#334155"; ctx.lineWidth = 1; ctx.stroke();
    ctx.setLineDash([]);
  }
  series.forEach(s => {
    ctx.beginPath();
    s.data.forEach((d, i) => i ? ctx.lineTo(X(s.data, i), Y(d.v)) : ctx.moveTo(X(s.data, 0), Y(d.v)));
    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.stroke();
    const last = s.data[s.data.length - 1];
    ctx.beginPath();
    ctx.arc(X(s.data, s.data.length - 1), Y(last.v), 3.5, 0, Math.PI * 2);
    ctx.fillStyle = s.color; ctx.fill();
  });
}

async function fetchQuotes() {
  const gen = ++fetchGen; // each refresh gets a generation; a newer
  const t = tf;           // one (e.g. a timeframe switch) supersedes it
  setLoading(true);
  showError(null);
  failedSymbols = [];
  const next = {};
  const failed = [];
  // fast path: multi-symbol spark API \u2014 4 requests for all 58 names
  // instead of 58 single-symbol requests (gentle on the free proxies)
  for (let i = 0; i < ALL.length; i += SPARK_CHUNK) {
    const chunk = ALL.slice(i, i + SPARK_CHUNK);
    try {
      Object.assign(next, await fetchSparkChunk(chunk, t));
    } catch (e) { /* whole chunk failed \u2014 retried below */ }
    if (gen !== fetchGen) return; // timeframe switched mid-flight
    chunk.forEach(s => { if (!next[s]) failed.push(s); });
    quotes = next;
    render();
    if (i + SPARK_CHUNK < ALL.length) await sleep(700);
  }
  // stragglers: single-symbol chart requests (better per-symbol errors)
  if (failed.length) {
    await sleep(2500);
    if (gen !== fetchGen) return;
    failedSymbols = [];
    await fetchStragglers(failed, next, failedSymbols, gen);
  }
  if (gen !== fetchGen) return;
  if (Object.keys(next).length === 0) {
    showError("Couldn't reach Yahoo Finance \u2014 the CORS proxy chain (allorigins / codetabs / jina) is down or rate-limiting. " +
      "Wait a minute and hit Refresh now; cached data is still shown.");
  } else {
    quotes = next;
    failedSymbols = ALL.filter(s => !next[s]);
    indexData = computeIndex(next);
    try { localStorage.setItem(cacheKeyFor(t), JSON.stringify({ ts: Date.now(), quotes: next })); } catch (e) {}
    lastUpdated = new Date();
  }
  setLoading(false);
  render();
}

function drawSpark(cv, data, up) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 280, h = cv.clientHeight || 52;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  const ps = data.map(d => d.p);
  const min = Math.min.apply(null, ps), max = Math.max.apply(null, ps);
  const span = (max - min) || 1;
  const X = i => (i / (data.length - 1)) * (w - 8) + 4;
  const Y = p => h - 6 - ((p - min) / span) * (h - 12);
  const color = up ? "#34d399" : "#fb7185";
  ctx.clearRect(0, 0, w, h);
  ctx.beginPath();
  data.forEach((d, i) => i ? ctx.lineTo(X(i), Y(d.p)) : ctx.moveTo(X(0), Y(d.p)));
  ctx.lineTo(X(data.length - 1), h); ctx.lineTo(X(0), h); ctx.closePath();
  ctx.fillStyle = up ? "rgba(52,211,153,0.10)" : "rgba(251,113,133,0.10)";
  ctx.fill();
  ctx.beginPath();
  data.forEach((d, i) => i ? ctx.lineTo(X(i), Y(d.p)) : ctx.moveTo(X(0), Y(d.p)));
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath();
  ctx.arc(X(data.length - 1), Y(ps[ps.length - 1]), 3, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
}

function fmt(n, d) { return (n >= 0 ? "+" : "") + n.toFixed(d); }

function activeStocks() {
  if (activeTab === "All") return WATCHLIST.flatMap(g => g.stocks);
  const g = WATCHLIST.find(g => g.group === activeTab);
  return g ? g.stocks : [];
}

function render() {
  document.getElementById("subtitle").textContent =
    "Live quotes via Yahoo Finance \u00b7 " + ALL.length + " stocks \u00b7 refreshes every 3 min";
  const badge = document.getElementById("badge");
  badge.textContent = lastUpdated ? "LIVE" : quotes && Object.keys(quotes).length ? "CACHED" : "WAIT";
  badge.className = "badge " + (lastUpdated ? "live" : "wait");
  document.getElementById("tfbox").innerHTML =
    Object.keys(TIMEFRAMES).map(t =>
      '<button class="tfbtn' + (t === tf ? " active" : "") + '" data-tf="' + t + '">' + t + "</button>"
    ).join("");

  // stats
  const qs = Object.values(quotes);
  let best = "\u2014", worst = "\u2014", avg = "\u2014", avgUp = true;
  if (qs.length) {
    const sorted = [...qs].sort((a, b) => b.dp - a.dp);
    avg = fmt(qs.reduce((a, q) => a + q.dp, 0) / qs.length, 2) + "%";
    avgUp = qs.reduce((a, q) => a + q.dp, 0) >= 0;
    const f = q => q.sym;
    const syms = Object.entries(quotes).sort((a, b) => b[1].dp - a[1].dp);
    const f2 = e => e[0] + " " + fmt(e[1].dp, 2) + "%";
    best = f2(syms[0]); worst = f2(syms[syms.length - 1]);
  }
  document.getElementById("stats").innerHTML =
    stat("Watchlist", ALL.length + " stocks") +
    stat("Avg day change", avg, avg ? (avgUp ? "up" : "down") : "") +
    stat("Best", best, "up") + stat("Worst", worst, "down");

  // tabs
  document.getElementById("tabs").innerHTML =
    WATCHLIST.map(g => '<button class="tab' + (activeTab === g.group ? " active" : "") +
      '" data-tab="' + g.group + '">' + g.group + "</button>").join("") +
    '<button class="tab' + (activeTab === "All" ? " active" : "") + '" data-tab="All">All</button>';

  // grid
  const grid = document.getElementById("grid");
  grid.innerHTML = activeStocks().map(s => {
    const q = quotes[s.symbol];
    const up = q ? q.dp >= 0 : true;
    const hist = q ? q.hist : null;
    return '<div class="card stock">' +
      '<div class="top"><div><div class="sym">' + s.symbol + '</div><div class="name">' + s.name + '</div></div>' +
      '<span class="arrow ' + (up ? "up" : "down") + '">' + (q ? (up ? "\u25b2" : "\u25bc") : "") + "</span></div>" +
      '<div class="prow"><div class="price">' + (q ? "$" + q.c.toFixed(2) : "\u2026") + "</div>" +
      '<div class="chg"><div class="pct ' + (up ? "up" : "down") + '">' + (q ? fmt(q.dp, 2) + "%" : "") + "</div>" +
      '<div class="abs">' + (q ? fmt(q.d, 2) + " today" : "") + "</div></div></div>" +
      (hist && hist.length > 1
        ? '<canvas data-sym="' + s.symbol + '"></canvas>' +
          '<div class="trendcap">' + TIMEFRAMES[tf].cap + '</div>'
        : "") +
      "</div>";
  }).join("");

  document.querySelectorAll("#grid canvas").forEach(cv => {
    const q = quotes[cv.dataset.sym];
    const hist = q ? q.hist : null;
    if (hist && hist.length > 1) drawSpark(cv, hist, q.dp >= 0);
  });

  // index panel
  const panel = document.getElementById("indexPanel");
  if (indexData && indexData.cap && indexData.cap.length > 1) {
    panel.style.display = "block";
    const cap = indexData.cap, eq = indexData.eq;
    const lastV = cap[cap.length - 1].v;
    const chg = (lastV / cap[0].v - 1) * 100;
    const eqChg = (eq[eq.length - 1].v / eq[0].v - 1) * 100;
    document.getElementById("idxValue").textContent = lastV.toFixed(4);
    document.getElementById("idxSub").textContent =
      tf + ": " + fmt(chg, 2) + "% (cap-weighted) vs " + fmt(eqChg, 2) + "% (equal-weight) \u00b7 " +
      indexData.n + " stocks \u00b7 weights as of 14 Nov 2026";
    drawMulti(document.getElementById("idxChart"), [
      { data: cap, color: "#38bdf8" },
      { data: eq, color: "#f59e0b" },
    ]);
  } else {
    panel.style.display = "none";
  }

  document.getElementById("footer").textContent = (lastUpdated
    ? "Last updated " + lastUpdated.toLocaleTimeString()
    : "Loading\u2026") +
    (failedSymbols.length ? " \u00b7 no data: " + failedSymbols.join(", ") : "") +
    " \u00b7 Data: Yahoo Finance (unofficial spark API, no key) via CORS proxy chain (allorigins \u2192 codetabs \u2192 jina)" +
    " \u00b7 US market hours 15:30\u201322:00 Madrid time";
}

function stat(label, value, tone) {
  return '<div class="card stat"><div class="label">' + label + '</div>' +
    '<div class="value ' + (tone || "") + '">' + value + "</div></div>";
}
function showError(msg) {
  const el = document.getElementById("error");
  el.style.display = msg ? "block" : "none";
  el.textContent = msg || "";
}
function setLoading(v) {
  loading = v;
  const b = document.getElementById("btnRefresh");
  b.disabled = v;
  b.textContent = v ? "Refreshing\u2026" : "Refresh now";
}
function syncTimer() {
  if (timer) { clearInterval(timer); timer = null; }
  if (autoRefresh) timer = setInterval(fetchQuotes, 180000);
}

// timeframe switching: show cached data for the new tf immediately,
// then fetch fresh. fetchQuotes uses generations, so an in-flight
// refresh for the old timeframe silently discards itself.
function setTf(t) {
  if (!TIMEFRAMES[t] || t === tf) return;
  tf = t;
  try { localStorage.setItem("capex_tf", t); } catch (e) {}
  quotes = loadCache(t);
  indexData = Object.keys(quotes).length ? computeIndex(quotes) : null;
  lastUpdated = null;
  showError(null);
  failedSymbols = [];
  render();
  fetchQuotes();
}

// wiring
document.getElementById("btnRefresh").addEventListener("click", fetchQuotes);
document.getElementById("tfbox").addEventListener("click", e => {
  const b = e.target.closest("[data-tf]");
  if (b) setTf(b.dataset.tf);
});
document.getElementById("tabs").addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if (t) { activeTab = t.dataset.tab; render(); }
});

// init: restore timeframe preference + cached quotes, then fetch fresh
{
  const t = localStorage.getItem("capex_tf");
  if (TIMEFRAMES[t]) tf = t;
  quotes = loadCache(tf);
  if (Object.keys(quotes).length) indexData = computeIndex(quotes);
}

syncTimer();
render();
fetchQuotes();
</script>
